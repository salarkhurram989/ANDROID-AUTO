plugins {
    id 'com.android.application'
}

android {
    namespace 'com.salardev.autodash'
    compileSdk 35

    defaultConfig {
        applicationId 'com.salardev.autodash'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.car.app:app:1.7.0'
}
